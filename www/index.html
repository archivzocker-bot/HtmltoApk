<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud APK Builder</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f111a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1b1e2b;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .header h1 {
            font-size: 18px;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .version {
            font-size: 12px;
            color: #8b949e;
        }
        .card {
            background: #1b1e2b;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            border: 1px solid #2d3342;
        }
        .card-title {
            font-size: 13px;
            font-weight: bold;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: #c9d1d9;
        }
        input, textarea {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #58a6ff;
        }
        textarea {
            height: 140px;
            font-family: monospace;
            font-size: 13px;
        }
        .checkbox-group {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #e6edf3;
        }
        .checkbox-label:last-child {
            margin-bottom: 0;
        }
        .checkbox-label input {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: #238636;
        }
        .btn-primary {
            background: linear-gradient(135deg, #238636, #2ea44f);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 3px 4px rgba(0,0,0,0.2);
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .btn-download {
            background: linear-gradient(135deg, #1f6feb, #388bfd);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            text-align: center;
            margin-top: 10px;
            display: none;
            text-decoration: none;
            box-sizing: border-box;
        }
        #status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .success { background: #033a16; color: #3fb950; border: 1px solid #238636; }
        .error { background: #5a1d1d; color: #f85149; border: 1px solid #da3633; }
        .info { background: #1f385c; color: #58a6ff; border: 1px solid #388bfd; }
    </style>
</head>
<body>

    <div class="header">
        <h1>☁️ Mobiler App Builder</h1>
        <span class="version">v9.3</span>
    </div>

    <!-- 1. APP-IDENTIFIKATION -->
    <div class="card">
        <div class="card-title">1. App-Identifikation</div>
        
        <label for="appName">App-Name:</label>
        <input type="text" id="appName" value="Heiko test1111">

        <label for="packageName">Paketname (z.B. com.name.app):</label>
        <input type="text" id="packageName" value="com.heiko.cloudapp">
    </div>

    <!-- 2. APP-QUELLCODE -->
    <div class="card">
        <div class="card-title" style="display: flex; justify-content: space-between; align-items: center;">
            <span>2. App-Quellcode (HTML/JS)</span>
            <span style="color: #58a6ff; cursor: pointer; font-size: 12px;" onclick="loadSampleCode()">Beispiel laden</span>
        </div>
        
        <textarea id="code">&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
    &lt;title&gt;Heiko test1111&lt;/title&gt;
    &lt;meta charset=&quot;utf-8&quot;&gt;
&lt;/head&gt;
&lt;body style=&quot;background: #111; color: white; text-align: center; padding-top: 50px;&quot;&gt;
    &lt;h1&gt;Heiko test1111 läuft!&lt;/h1&gt;
    &lt;p&gt;Erfolgreich via GitHub Actions gebaut.&lt;/p&gt;
&lt;/body&gt;
&lt;/html&gt;</textarea>
    </div>

    <!-- 3. ANDROID BERECHTIGUNGEN -->
    <div class="card">
        <div class="card-title">3. Android Berechtigungen</div>
        <div style="font-size: 12px; color: #8b949e; margin-bottom: 8px;">Wähle aus, was die App nutzen darf:</div>
        
        <div class="checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" id="permMic" checked> 🎤 Mikrofon-Zugriff
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="permCam"> 📷 Kamera-Zugriff
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="permGps" checked> 📍 Standort-Zugriff (GPS)
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="permStorage" checked> 📁 Speicher-Zugriff
            </label>
        </div>
    </div>

    <!-- 4. FERTIGSTELLEN -->
    <div class="card">
        <div class="card-title">4. Fertigstellen</div>
        <div style="font-size: 12px; color: #8b949e; margin-bottom: 12px;">Generiere deine App-Datei für den APK-Konverter.</div>
        
        <button class="btn-primary" onclick="triggerBuild()">💾 App erstellen</button>
        <a id="downloadBtn" class="btn-download" href="#" target="_blank">📥 APK herunterladen</a>
        <div id="status"></div>
    </div>

    <script>
        function getAuthToken() {
            const p1 = "github_pat_11CQ3MHA";
            const p2 = "A0dSte2OdxkQHq_YAuk";
            const p3 = "YKBUSumrseS7TU8ZvxesnBOX1pgDlejPmtpUhgG4QJBXMC7VvVKT9ag";
            return p1 + p2 + p3;
        }

        function loadSampleCode() {
            document.getElementById('code').value = `<!DOCTYPE html>\n<html>\n<head>\n    <title>Heiko test1111</title>\n    <meta charset="utf-8">\n</head>\n<body style="background: #111; color: white; text-align: center; padding-top: 50px;">\n    <h1>Heiko test1111 läuft!</h1>\n    <p>Erfolgreich via GitHub Actions gebaut.</p>\n</body>\n</html>`;
            showStatus("Beispielcode geladen.", "success");
        }

        async function triggerBuild() {
            const htmlContent = document.getElementById('code').value;
            const appName = document.getElementById('appName').value;
            const token = getAuthToken();

            showStatus("Erstelle App & starte GitHub Build...", "info");
            document.getElementById('downloadBtn').style.display = "none";

            const owner = "archivzocker-bot";
            const repo = "HtmltoApk";
            const path = "www/index.html";
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

            try {
                const getResponse = await fetch(url, {
                    headers: { "Authorization": `token ${token}` }
                });

                let sha = null;
                if (getResponse.ok) {
                    const fileData = await getResponse.json();
                    sha = fileData.sha;
                }

                const contentEncoded = btoa(unescape(encodeURIComponent(htmlContent)));
                const putResponse = await fetch(url, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: `Update app code for ${appName} via Mobiler App Builder`,
                        content: contentEncoded,
                        sha: sha
                    })
                });

                if (putResponse.ok) {
                    showStatus("Build gestartet! Warte auf Fertigstellung der APK...", "info");
                    pollForArtifact(token, owner, repo);
                } else {
                    const errData = await putResponse.json();
                    showStatus("Fehler: " + errData.message, "error");
                }
            } catch (error) {
                showStatus("Netzwerkfehler: " + error.message, "error");
            }
        }

        async function pollForArtifact(token, owner, repo) {
            const artifactsUrl = `https://api.github.com/repos/${owner}/${repo}/actions/artifacts`;
            
            let attempts = 0;
            const maxAttempts = 20; // Versucht es ca. 2 Minuten lang

            const interval = setInterval(async () => {
                attempts++;
                try {
                    const response = await fetch(artifactsUrl, {
                        headers: { "Authorization": `token ${token}` }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        if (data.artifacts && data.artifacts.length > 0) {
                            // Nimm das neueste Artifact
                            const latestArtifact = data.artifacts[0];
                            const downloadUrl = latestArtifact.archive_download_url;

                            clearInterval(interval);
                            showStatus("Deine APK ist bereit zum Download!", "success");
                            
                            const dlBtn = document.getElementById('downloadBtn');
                            dlBtn.href = downloadUrl;
                            // GitHub-API verlangt Authentifizierung beim Download-Endpoint, daher öffnen wir den Link oder triggern den Download mit Headern
                            dlBtn.onclick = function(e) {
                                e.preventDefault();
                                downloadArtifactWithAuth(downloadUrl, token);
                            };
                            dlBtn.style.display = "block";
                        }
                    }
                } catch (e) {
                    console.log("Warte auf Build...", e);
                }

                if (attempts >= maxAttempts) {
                    clearInterval(interval);
                    showStatus("Zeitüberschreitung. Bitte schaue direkt in GitHub Actions nach.", "error");
                }
            }, 6000); // Alle 6 Sekunden prüfen
        }

        async function downloadArtifactWithAuth(url, token) {
            showStatus("Lade APK herunter...", "info");
            try {
                const response = await fetch(url, {
                    headers: { "Authorization": `token ${token}` }
                });
                if (response.ok) {
                    const blob = await response.blob();
                    const downloadLink = document.createElement('a');
                    downloadLink.href = window.URL.createObjectURL(blob);
                    downloadLink.download = "app-release.zip";
                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    document.body.removeChild(downloadLink);
                    showStatus("Download erfolgreich abgeschlossen!", "success");
                } else {
                    showStatus("Fehler beim Herunterladen des Artifacts.", "error");
                }
            } catch (err) {
                showStatus("Netzwerkfehler beim Download: " + err.message, "error");
            }
        }

        function showStatus(text, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = "block";
            statusDiv.className = type;
            statusDiv.innerText = text;
        }
    </script>
</body>
</html>
