name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Cordova and Build
      run: |
        npm install -g cordova
        cordova-create myApp com.example.app MyApp
        cd myApp
        cordova platform add android
        cordova build android --debug
        mkdir -p ../output
        cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../output/my-android-app.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: output/my-android-app.apk
